<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Klowee Admin</title>
    <meta name="color-scheme" content="light" />
    <!-- Light for everyone; dark only if the owner chose it with the sidebar
         switch. Applied here, before first paint, so a dark choice never
         flashes light. The key matches src/lib/theme.ts (tested). -->
    <script>
      try {
        if (localStorage.getItem('klowee.admin.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {}
    </script>
    <!-- Self-hosted fonts (src/index.css), the client site's files. The body
         face is requested before the CSS asks for it. -->
    <link rel="preload" href="/fonts/karla-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
