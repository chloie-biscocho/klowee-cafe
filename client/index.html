<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Klowee Cafe · smol pop-up cafe, Cagayan de Oro</title>
    <meta
      name="description"
      content="Handcrafted coffee, matcha, and fruit sodas, rolling into your events around Cagayan de Oro."
    />
    <meta name="theme-color" content="#F7F3E8" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Klowee Cafe" />
    <meta property="og:title" content="Klowee Cafe · smol pop-up cafe, Cagayan de Oro" />
    <meta
      property="og:description"
      content="Handcrafted coffee, matcha, and fruit sodas, rolling into your events around Cagayan de Oro."
    />
    <!-- Static on purpose: link previews are built by crawlers that do not run
         JavaScript, so the hero image from the API could never reach them. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts are self-hosted (src/index.css). The two that paint first, the
         headings and the body text, are requested before the CSS asks for
         them; Caveat waits for the CSS. crossorigin is required for fonts,
         even same-origin, or the preloaded file is fetched twice. -->
    <link rel="preload" href="/fonts/fuzzy-bubbles-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
