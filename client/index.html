<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Klowee Cafe · smol pop-up cafe, Cagayan de Oro</title>
    <meta
      name="description"
      content="Handcrafted coffee, matcha, and fruit sodas, rolling into your events around Cagayan de Oro."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#A9D6F5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A2452" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Klowee Cafe" />
    <meta property="og:title" content="Klowee Cafe · smol pop-up cafe, Cagayan de Oro" />
    <meta
      property="og:description"
      content="Handcrafted coffee, matcha, and fruit sodas, rolling into your events around Cagayan de Oro."
    />
    <!-- Static on purpose: link previews are built by crawlers that do not run
         JavaScript, so the hero image from the API could never reach them. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Self-hosted fonts (src/index.css). The two that paint first, the serif
         headings and the body text, are requested before the CSS asks for
         them; Shantell Sans (menu and captions) waits. crossorigin is required
         for fonts, even same-origin, or the preloaded file is fetched twice. -->
    <link rel="preload" href="/fonts/young-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/karla-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The page's one API request, started while the HTML is still parsing
         rather than after the script runs (src/api/useHomeData.ts makes the
         same request and is handed this response). -->
    <link rel="preload" href="%VITE_API_URL%/api/public/home" as="fetch" crossorigin />
    <!-- The hero logo is static, so it can start before the script runs. -->
    <link rel="preload" href="/logo.jpg" as="image" fetchpriority="high" />
  </head>
  <body>
    <div id="root"><link rel="preload" as="image" href="/logo.jpg" fetchPriority="high"/><div id="top"><a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-3 focus:left-3 focus:z-50 focus:rounded-full focus:bg-deep focus:px-5 focus:py-2 focus:font-bold focus:text-sky">Skip to content</a><div class="mx-auto max-w-page px-[22px]"><header class="flex flex-wrap items-center justify-between gap-3.5 py-[18px]"><a href="#top" aria-label="Klowee Cafe home" class="font-serif text-[1.2rem] text-deep no-underline">klowee cafe</a><nav aria-label="Main"><ul class="flex flex-wrap"><li><a href="#story" class="mr-4 inline-block font-medium whitespace-nowrap text-deep no-underline underline-offset-[5px] hover:underline md:mr-0 md:ml-5">our story</a></li><li><a href="#menu" class="mr-4 inline-block font-medium whitespace-nowrap text-deep no-underline underline-offset-[5px] hover:underline md:mr-0 md:ml-5">menu</a></li><li><a href="#popups" class="mr-4 inline-block font-medium whitespace-nowrap text-deep no-underline underline-offset-[5px] hover:underline md:mr-0 md:ml-5">pop-ups</a></li><li><a href="#packages" class="mr-4 inline-block font-medium whitespace-nowrap text-deep no-underline underline-offset-[5px] hover:underline md:mr-0 md:ml-5">packages</a></li><li><a href="#book" class="mr-4 inline-block font-medium whitespace-nowrap text-deep no-underline underline-offset-[5px] hover:underline md:mr-0 md:ml-5">book</a></li></ul></nav></header><main id="main" tabindex="-1" class="focus:outline-none"><section aria-label="Klowee Cafe" class="relative pt-[30px] pb-3 text-center"><div class="cloud cloud-1" aria-hidden="true"></div><div class="cloud cloud-2" aria-hidden="true"></div><div class="cloud cloud-3" aria-hidden="true"></div><div class="cloud cloud-4" aria-hidden="true"></div><div class="cloud cloud-5" aria-hidden="true"></div><div class="cloud cloud-6" aria-hidden="true"></div><img src="/logo.jpg" alt="Klowee Cafe logo: Klowe and Kee in cat beanies" width="440" height="440" fetchPriority="high" decoding="async" class="relative z-[1] mx-auto mb-[26px] block size-[184px] rounded-full"/><div aria-hidden="true" class="relative z-[1] mx-auto flex max-w-[44ch] flex-col items-center"><div class="h-[clamp(4.24rem,11.9vw,7.63rem)] w-[min(16ch,100%)] rounded-3xl bg-cloud/60 font-serif text-[clamp(2rem,5.6vw,3.6rem)]"></div><div class="mt-3.5 mb-[22px] h-[3.3em] w-full rounded-2xl bg-cloud/60"></div><div class="h-12 w-40 rounded-full bg-cloud/60"></div></div></section><div aria-busy="true" aria-label="Loading"><div class="mx-auto h-[170px] max-w-[760px] md:h-[200px]"></div><div class="mb-[26px] h-64 rounded-[28px] bg-panel/60"></div><div class="mb-[26px] h-96 rounded-md bg-paper/60"></div></div></main></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
